
name: Pastry Menu - Base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Frontend
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Validar Backend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Validar TypeScript
        working-directory: ./backend
        run: npx tsc --noEmit
